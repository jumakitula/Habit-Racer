<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>August Goal Runner - Temple Run Edition</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; text-align: center; padding: 15px; user-select: none; }
    h1 { margin-bottom: 8px; color: #38bdf8; font-size: 24px; }
    .card { background: #1e293b; max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
    input { background: #334155; color: #fff; }
    button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .hidden { display: none !important; }

    /* Host Canvas & Leaderboard */
    #host-container { max-width: 900px; margin: 0 auto; }
    canvas { background: #1e293b; border-radius: 12px; width: 100%; border: 2px solid #334155; }
    #leaderboard { margin-top: 15px; background: #1e293b; padding: 15px; border-radius: 8px; text-align: left; }
    .player-rank { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; }

    /* Player Temple Run Screen */
    #player-game { position: relative; width: 100%; max-width: 400px; margin: 0 auto; height: 380px; background: #0284c7; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; border: 3px solid #38bdf8; }
    
    #track-area { position: relative; width: 100%; height: 220px; background: #0f172a; border-radius: 10px; overflow: hidden; border: 2px solid #334155; }
    
    /* Distraction Banner */
    #distraction-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 10px 18px; border-radius: 20px; font-weight: bold; font-size: 18px; white-space: nowrap; transition: transform 0.1s linear, top 1.5s linear; animation: approach 2.5s infinite linear; }
    
    @keyframes approach {
      0% { top: -40px; transform: translateX(-50%) scale(0.5); opacity: 0.5; }
      100% { top: 130px; transform: translateX(-50%) scale(1.3); opacity: 1; }
    }

    #player-avatar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 36px; transition: transform 0.2s; }
    .jumping { transform: translateX(-50%) translateY(-60px) scale(1.2) !important; }

    /* Controls */
    .btn-group { display: flex; gap: 10px; width: 100%; }
    .btn-action { flex: 1; padding: 15px; font-size: 18px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    #btn-jump { background: #22c55e; color: white; }
    #btn-shoot { background: #f59e0b; color: white; }
    .stat-header { font-size: 18px; font-weight: bold; color: #f8fafc; }
    #hit-feedback { font-size: 16px; height: 24px; font-weight: bold; color: #facc15; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>🏃 August Goal Runner (Temple Run) 🏁</h1>

  <div id="role-select" class="card">
    <h3>Select Mode</h3>
    <button id="btn-host">Host Game (Projector Screen)</button>
    <button id="btn-player">Join as Player (Phone Screen)</button>
  </div>

  <div id="player-join" class="card hidden">
    <h3>Join the August Race</h3>
    <input type="text" id="player-name" placeholder="Enter your name..." maxlength="12">
    <button id="btn-start-racing">Start Running!</button>
  </div>

  <div id="player-game-wrapper" class="hidden">
    <div id="player-game">
      <div class="stat-header">Distance: <span id="player-dist">0</span> / 1000m</div>
      
      <div id="track-area">
        <div id="distraction-box">⚠️ Unnecessary Scrolling</div>
        <div id="player-avatar">🏃‍♂️</div>
      </div>

      <div id="hit-feedback">Dodge or Shoot the Distractions!</div>

      <div class="btn-group">
        <button id="btn-jump" class="btn-action">🦘 JUMP!</button>
        <button id="btn-shoot" class="btn-action">🎯 SHOOT!</button>
      </div>
    </div>
  </div>

  <div id="host-container" class="hidden">
    <canvas id="raceCanvas" width="800" height="400"></canvas>
    <div id="leaderboard">
      <h3>🏆 August Leaderboard</h3>
      <div id="ranks"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      push, 
      remove, 
      update, 
      onValue, 
      onDisconnect 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

    // --- YOUR FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCvKypeR1gqLb96SlT5-4ebCXSJjl768yE",
      authDomain: "habitracer-1d4ed.firebaseapp.com",
      databaseURL: "https://habitracer-1d4ed-default-rtdb.firebaseio.com",
      projectId: "habitracer-1d4ed",
      storageBucket: "habitracer-1d4ed.firebasestorage.app",
      messagingSenderId: "97473637086",
      appId: "1:97473637086:web:b979c8356131d4b82f304f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, 'players');

    // List of August Distractions
    const DISTRACTIONS = [
      { name: "📱 Unnecessary Scrolling", type: "jump" },
      { name: "🛌 Procrastination", type: "jump" },
      { name: "🍿 Late Night Binge", type: "shoot" },
      { name: "🎮 Gaming All Night", type: "shoot" },
      { name: "⏰ Snoozing Alarms", type: "jump" },
      { name: "💭 Overthinking", type: "shoot" }
    ];

    let myPlayerId = null;
    let distance = 0;
    const FINISH_LINE = 1000;
    let currentDistraction = DISTRACTIONS[0];

    // --- EVENT LISTENERS ---
    document.getElementById('btn-host').addEventListener('click', setupHost);
    document.getElementById('btn-player').addEventListener('click', setupPlayerView);
    document.getElementById('btn-start-racing').addEventListener('click', joinGame);
    document.getElementById('btn-jump').addEventListener('click', () => handleAction('jump'));
    document.getElementById('btn-shoot').addEventListener('click', () => handleAction('shoot'));

    function setupHost() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('host-container').classList.remove('hidden');
      remove(playersRef); 
      startHostCanvas();
    }

    function setupPlayerView() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('player-join').classList.remove('hidden');
    }

    function joinGame() {
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) return alert("Please enter your name!");

      const newPlayerRef = push(playersRef);
      myPlayerId = newPlayerRef.key;

      set(newPlayerRef, {
        name: nameInput,
        distance: 0
      });

      onDisconnect(newPlayerRef).remove();

      document.getElementById('player-join').classList.add('hidden');
      document.getElementById('player-game-wrapper').classList.remove('hidden');
      
      // Start cycling distractions on player screen
      cycleDistractions();
    }

    function cycleDistractions() {
      setInterval(() => {
        if (distance >= FINISH_LINE) return;
        currentDistraction = DISTRACTIONS[Math.floor(Math.random() * DISTRACTIONS.length)];
        const distBox = document.getElementById('distraction-box');
        distBox.innerText = currentDistraction.name;
        
        // Reset animation
        distBox.style.animation = 'none';
        distBox.offsetHeight; /* trigger reflow */
        distBox.style.animation = 'approach 2.5s infinite linear';
      }, 2500);
    }

    function handleAction(actionType) {
      if (!myPlayerId || distance >= FINISH_LINE) return;

      const avatar = document.getElementById('player-avatar');
      const feedback = document.getElementById('hit-feedback');

      if (actionType === 'jump') {
        avatar.classList.add('jumping');
        setTimeout(() => avatar.classList.remove('jumping'), 300);
      }

      if (actionType === currentDistraction.type) {
        // Correct dodge or shoot!
        let boost = Math.floor(Math.random() * 25) + 20;
        distance = Math.min(FINISH_LINE, distance + boost);
        feedback.innerText = `✨ Dodged ${currentDistraction.name}! (+${boost}m)`;
        feedback.style.color = "#4ade80";
      } else {
        // Wrong action or failed dodge
        let penalty = 5;
        distance = Math.max(0, distance + penalty); // slight progress anyway
        feedback.innerText = `💥 Hit by ${currentDistraction.name}! (+${penalty}m)`;
        feedback.style.color = "#f87171";
      }

      document.getElementById('player-dist').innerText = distance;

      const myRef = ref(db, `players/${myPlayerId}`);
      update(myRef, { distance: distance });

      if (distance >= FINISH_LINE) {
        feedback.innerText = "🏆 FINISHED! August Conquered!";
        feedback.style.color = "#38bdf8";
      }
    }

    // --- HOST CANVAS & LEADERBOARD ---
    function startHostCanvas() {
      const canvas = document.getElementById('raceCanvas');
      const ctx = canvas.getContext('2d');
      let playersData = {};

      onValue(playersRef, (snapshot) => {
        playersData = snapshot.val() || {};
        updateLeaderboard(playersData);
      });

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Finish Line
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(750, 0, 10, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("FINISH", 755, 20);

        let playersArray = Object.values(playersData);
        let laneHeight = canvas.height / Math.max(playersArray.length, 1);

        playersArray.forEach((player, index) => {
          let xProgress = (player.distance / FINISH_LINE) * 720;
          let yPos = index * laneHeight + laneHeight / 2;

          // Draw Lane Divider
          ctx.strokeStyle = "#334155";
          ctx.beginPath();
          ctx.moveTo(0, index * laneHeight);
          ctx.lineTo(canvas.width, index * laneHeight);
          ctx.stroke();

          // Draw Runner Icon
          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(xProgress + 20, yPos, 12, 0, Math.PI * 2);
          ctx.fill();

          // Draw Player Name
          ctx.fillStyle = "#fff";
          ctx.font = "14px sans-serif";
          ctx.fillText(`🏃 ${player.name}`, xProgress + 38, yPos + 4);
        });

        requestAnimationFrame(render);
      }

      render();
    }

    function updateLeaderboard(playersData) {
      const ranksContainer = document.getElementById('ranks');
      ranksContainer.innerHTML = "";

      let sorted = Object.values(playersData).sort((a, b) => b.distance - a.distance);

      sorted.forEach((player, idx) => {
        let div = document.createElement('div');
        div.className = 'player-rank';
        div.innerHTML = `<span>#${idx + 1} <b>${player.name}</b></span> <span>${player.distance} m</span>`;
        ranksContainer.appendChild(div);
      });
    }
  </script>
</body>
</html>
