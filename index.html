<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>August Adventure Run</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; text-align: center; padding: 10px; user-select: none; }
    h1 { margin-bottom: 8px; color: #38bdf8; font-size: 22px; }
    .card { background: #1e293b; max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
    input { background: #334155; color: #fff; }
    button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
    .hidden { display: none !important; }

    /* Host Canvas & Leaderboard */
    #host-container { max-width: 900px; margin: 0 auto; }
    canvas { background: #1e293b; border-radius: 12px; width: 100%; border: 2px solid #334155; }
    #leaderboard { margin-top: 15px; background: #1e293b; padding: 15px; border-radius: 8px; text-align: left; }
    .player-rank { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; }

    /* Player Canvas & Controls */
    #player-game-wrapper { max-width: 420px; margin: 0 auto; }
    #gameCanvas { background: #0f172a; border-radius: 12px; border: 2px solid #38bdf8; display: block; margin: 0 auto; width: 100%; height: auto; }
    .touch-controls { display: flex; gap: 10px; margin-top: 10px; }
    .touch-btn { flex: 1; padding: 18px; font-size: 20px; font-weight: bold; background: #0284c7; color: white; border-radius: 10px; border: none; }
    .touch-btn:active { background: #0369a1; }
    .stat-header { font-size: 16px; font-weight: bold; color: #f8fafc; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h1>🏃 August Adventure Runner 🏁</h1>

  <!-- ROLE SELECTION -->
  <div id="role-select" class="card">
    <h3>Select Mode</h3>
    <button id="btn-host">Host Game (Projector Screen)</button>
    <button id="btn-player">Join as Player (Phone Screen)</button>
  </div>

  <!-- PLAYER JOIN FORM -->
  <div id="player-join" class="card hidden">
    <h3>Join the August Race</h3>
    <input type="text" id="player-name" placeholder="Enter your name..." maxlength="12">
    <button id="btn-start-racing">Start Running!</button>
  </div>

  <!-- PLAYER GAME CANVAS -->
  <div id="player-game-wrapper" class="hidden">
    <div class="stat-header">Distance: <span id="player-dist">0</span> / 1000m</div>
    <canvas id="gameCanvas" width="360" height="240"></canvas>
    <div class="touch-controls">
      <button id="btn-jump" class="touch-btn">🦘 JUMP</button>
    </div>
  </div>

  <!-- HOST DISPLAY -->
  <div id="host-container" class="hidden">
    <canvas id="raceCanvas" width="800" height="400"></canvas>
    <div id="leaderboard">
      <h3>🏆 August Leaderboard</h3>
      <div id="ranks"></div>
    </div>
  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      push, 
      remove, 
      update, 
      onValue, 
      onDisconnect 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvKypeR1gqLb96SlT5-4ebCXSJjl768yE",
      authDomain: "habitracer-1d4ed.firebaseapp.com",
      databaseURL: "https://habitracer-1d4ed-default-rtdb.firebaseio.com",
      projectId: "habitracer-1d4ed",
      storageBucket: "habitracer-1d4ed.firebasestorage.app",
      messagingSenderId: "97473637086",
      appId: "1:97473637086:web:b979c8356131d4b82f304f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, 'players');

    let myPlayerId = null;
    let distance = 0;
    const FINISH_LINE = 1000;

    document.getElementById('btn-host').addEventListener('click', setupHost);
    document.getElementById('btn-player').addEventListener('click', setupPlayerView);
    document.getElementById('btn-start-racing').addEventListener('click', joinGame);

    function setupHost() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('host-container').classList.remove('hidden');
      remove(playersRef); 
      startHostCanvas();
    }

    function setupPlayerView() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('player-join').classList.remove('hidden');
    }

    function joinGame() {
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) return alert("Please enter your name!");

      const newPlayerRef = push(playersRef);
      myPlayerId = newPlayerRef.key;

      set(newPlayerRef, {
        name: nameInput,
        distance: 0
      });

      onDisconnect(newPlayerRef).remove();

      document.getElementById('player-join').classList.add('hidden');
      document.getElementById('player-game-wrapper').classList.remove('hidden');
      
      startPlayerPlatformer();
    }

    // --- PLAYER CANVAS GAME ENGINE ---
    function startPlayerPlatformer() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      let runner = {
        x: 40,
        y: 160,
        width: 24,
        height: 32,
        velocityY: 0,
        isJumping: false
      };

      let gravity = 0.8;
      let groundY = 160;
      let obstacles = [];
      let items = [];
      let gameFrame = 0;

      const distractionLabels = ["Scrolling 📱", "Lazy Day 🛌", "Late Night 🍿", "Snooze ⏰"];
      const habitLabels = ["Study 📚", "Water 💧", "Workout 🏋️", "Sleep 🌙"];

      function doJump() {
        if (!runner.isJumping) {
          runner.velocityY = -13;
          runner.isJumping = true;
        }
      }

      document.getElementById('btn-jump').addEventListener('click', doJump);
      window.addEventListener('keydown', (e) => { if (e.code === 'Space') doJump(); });

      function gameLoop() {
        if (distance >= FINISH_LINE) {
          ctx.fillStyle = "#22c55e";
          ctx.font = "bold 20px sans-serif";
          ctx.fillText("🏆 AUGUST GOAL CONQUERED!", 30, 120);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        gameFrame++;

        // Draw Ground
        ctx.fillStyle = "#334155";
        ctx.fillRect(0, groundY + runner.height, canvas.width, 50);

        // Runner Physics
        runner.velocityY += gravity;
        runner.y += runner.velocityY;

        if (runner.y >= groundY) {
          runner.y = groundY;
          runner.velocityY = 0;
          runner.isJumping = false;
        }

        // Draw Character Sprite
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(runner.x, runner.y, runner.width, runner.height);
        // Head
        ctx.fillStyle = "#fde047";
        ctx.fillRect(runner.x + 4, runner.y - 10, 16, 10);

        // Auto Movement / Progression
        distance = Math.min(FINISH_LINE, distance + 1);

        // Spawn Distractions (Obstacles)
        if (gameFrame % 110 === 0) {
          obstacles.push({
            x: canvas.width,
            y: groundY + 4,
            width: 28,
            height: 28,
            text: distractionLabels[Math.floor(Math.random() * distractionLabels.length)]
          });
        }

        // Spawn Habit Boosts
        if (gameFrame % 160 === 0) {
          items.push({
            x: canvas.width,
            y: groundY - 45,
            width: 22,
            height: 22,
            text: habitLabels[Math.floor(Math.random() * habitLabels.length)]
          });
        }

        // Handle Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.x -= 4;

          // Draw Obstacle
          ctx.fillStyle = "#ef4444";
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
          ctx.fillStyle = "#fff";
          ctx.font = "10px sans-serif";
          ctx.fillText(obs.text, obs.x - 10, obs.y - 5);

          // Collision Detection
          if (
            runner.x < obs.x + obs.width &&
            runner.x + runner.width > obs.x &&
            runner.y < obs.y + obs.height &&
            runner.y + runner.height > obs.y
          ) {
            distance = Math.max(0, distance - 25); // Hit obstacle penalty
            obstacles.splice(i, 1);
          } else if (obs.x < -40) {
            obstacles.splice(i, 1);
          }
        }

        // Handle Habit Items
        for (let j = items.length - 1; j >= 0; j--) {
          let item = items[j];
          item.x -= 4;

          // Draw Habit Pickup
          ctx.fillStyle = "#22c55e";
          ctx.fillRect(item.x, item.y, item.width, item.height);
          ctx.fillStyle = "#fff";
          ctx.font = "10px sans-serif";
          ctx.fillText(item.text, item.x - 5, item.y - 5);

          // Pickup Detection
          if (
            runner.x < item.x + item.width &&
            runner.x + runner.width > item.x &&
            runner.y < item.y + item.height &&
            runner.y + runner.height > item.y
          ) {
            distance = Math.min(FINISH_LINE, distance + 35); // Habit pickup bonus!
            items.splice(j, 1);
          } else if (item.x < -40) {
            items.splice(j, 1);
          }
        }

        // Sync distance with Firebase
        document.getElementById('player-dist').innerText = Math.floor(distance);
        const myRef = ref(db, `players/${myPlayerId}`);
        update(myRef, { distance: Math.floor(distance) });

        requestAnimationFrame(gameLoop);
      }

      gameLoop();
    }

    // --- HOST ENGINE ---
    function startHostCanvas() {
      const canvas = document.getElementById('raceCanvas');
      const ctx = canvas.getContext('2d');
      let playersData = {};

      onValue(playersRef, (snapshot) => {
        playersData = snapshot.val() || {};
        updateLeaderboard(playersData);
      });

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Finish Line
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(750, 0, 10, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("FINISH", 755, 20);

        let playersArray = Object.values(playersData);
        let laneHeight = canvas.height / Math.max(playersArray.length, 1);

        playersArray.forEach((player, index) => {
          let xProgress = (player.distance / FINISH_LINE) * 720;
          let yPos = index * laneHeight + laneHeight / 2;

          ctx.strokeStyle = "#334155";
          ctx.beginPath();
          ctx.moveTo(0, index * laneHeight);
          ctx.lineTo(canvas.width, index * laneHeight);
          ctx.stroke();

          ctx.fillStyle = "#38bdf8";
          ctx.beginPath();
          ctx.arc(xProgress + 20, yPos, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#fff";
          ctx.font = "14px sans-serif";
          ctx.fillText(`🏃 ${player.name}`, xProgress + 38, yPos + 4);
        });

        requestAnimationFrame(render);
      }

      render();
    }

    function updateLeaderboard(playersData) {
      const ranksContainer = document.getElementById('ranks');
      ranksContainer.innerHTML = "";

      let sorted = Object.values(playersData).sort((a, b) => b.distance - a.distance);

      sorted.forEach((player, idx) => {
        let div = document.createElement('div');
        div.className = 'player-rank';
        div.innerHTML = `<span>#${idx + 1} <b>${player.name}</b></span> <span>${player.distance} m</span>`;
        ranksContainer.appendChild(div);
      });
    }
  </script>
</body>
</html>
