<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>August Goal Conquest - Spider-Man Edition</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #090d16; color: #fff; text-align: center; padding: 10px; user-select: none; touch-action: manipulation; transition: background 0.1s; }
    h1 { margin-bottom: 8px; color: #ef4444; font-size: 22px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
    .card { background: #1e293b; max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); border: 1px solid #334155; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
    input { background: #334155; color: #fff; }
    button { background: #dc2626; color: white; font-weight: bold; cursor: pointer; transition: 0.1s; }
    button:active { transform: scale(0.98); }
    .hidden { display: none !important; }

    /* Host View & Timer */
    #host-container { max-width: 900px; margin: 0 auto; position: relative; }
    #timer-display { font-size: 28px; font-weight: bold; color: #facc15; background: #1e293b; padding: 8px 20px; border-radius: 30px; display: inline-block; margin-bottom: 12px; border: 2px solid #eab308; box-shadow: 0 0 12px rgba(234, 179, 8, 0.4); }
    canvas { background: #0f172a; border-radius: 12px; width: 100%; border: 2px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
    #leaderboard { margin-top: 15px; background: #1e293b; padding: 15px; border-radius: 8px; text-align: left; }
    .player-rank { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; }

    /* Victory Modal / Winner Screen */
    #winner-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 3px solid #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.5); z-index: 10; }
    #winner-screen h2 { color: #facc15; font-size: 32px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
    .winner-box { background: #1e293b; padding: 15px 30px; border-radius: 12px; font-size: 22px; font-weight: bold; margin: 8px; width: 80%; border: 1px solid #334155; }
    .rank-1 { color: #facc15; border-color: #facc15; font-size: 26px; }
    .rank-2 { color: #cbd5e1; }
    .rank-3 { color: #f97316; }

    /* Mobile Controls Layout */
    #player-game-wrapper { max-width: 420px; margin: 0 auto; }
    #gameCanvas { background: #020617; border-radius: 12px; border: 2px solid #ef4444; display: block; margin: 0 auto; width: 100%; max-height: 250px; }
    
    .controller { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 10px; background: #1e293b; border-radius: 16px; border: 1px solid #334155; }
    .dpad { display: flex; gap: 8px; }
    .ctrl-btn { width: 65px; height: 60px; font-size: 22px; font-weight: bold; background: #334155; color: white; border-radius: 12px; border: none; box-shadow: 0 4px 0 #1e293b; display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #1e293b; background: #dc2626; }
    .btn-jump { width: 90px; height: 60px; background: #22c55e; box-shadow: 0 4px 0 #15803d; font-size: 18px; }
    .btn-jump:active { background: #16a34a; box-shadow: 0 0 0 #15803d; }
    
    .stat-header { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; color: #ef4444; margin-bottom: 8px; padding: 0 5px; }
    
    /* Screen Flash for Damage */
    .hit-flash { background: #450a0a !important; }
  </style>
</head>
<body>

  <h1>🕷️ August Spider-Man Goal Conquest 🏁</h1>

  <!-- ROLE SELECTION -->
  <div id="role-select" class="card">
    <h3>Select Mode</h3>
    <button id="btn-host">Host Game (Projector Screen)</button>
    <button id="btn-player">Join as Player (Phone Screen)</button>
  </div>

  <!-- PLAYER JOIN FORM -->
  <div id="player-join" class="card hidden">
    <h3>Join the August Race</h3>
    <input type="text" id="player-name" placeholder="Enter your name..." maxlength="12">
    <button id="btn-start-racing">Start Playing!</button>
  </div>

  <!-- PLAYER GAME CANVAS & CONTROLLER -->
  <div id="player-game-wrapper" class="hidden">
    <div class="stat-header">
      <span>Goal Progress: <span id="player-dist">0</span>m</span>
      <span>Target: 1000m</span>
    </div>

    <canvas id="gameCanvas" width="400" height="240"></canvas>

    <!-- TOUCH D-PAD CONTROLLER -->
    <div class="controller">
      <div class="dpad">
        <button id="btn-left" class="ctrl-btn">◀</button>
        <button id="btn-right" class="ctrl-btn">▶</button>
      </div>
      <button id="btn-jump" class="ctrl-btn btn-jump">🦘 JUMP</button>
    </div>
  </div>

  <!-- HOST DISPLAY -->
  <div id="host-container" class="hidden">
    <div id="timer-display">⏱️ Time Left: 05:00</div>
    
    <div style="position: relative;">
      <canvas id="raceCanvas" width="800" height="400"></canvas>

      <!-- WINNER SCREEN OVERLAY -->
      <div id="winner-screen" class="hidden">
        <h2>🏆 AUGUST GAME OVER! 🏆</h2>
        <div id="winner-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
      </div>
    </div>

    <div id="leaderboard">
      <h3>🏆 Realtime Leaderboard</h3>
      <div id="ranks"></div>
    </div>
  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      push, 
      remove, 
      update, 
      onValue, 
      onDisconnect 
    } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvKypeR1gqLb96SlT5-4ebCXSJjl768yE",
      authDomain: "habitracer-1d4ed.firebaseapp.com",
      databaseURL: "https://habitracer-1d4ed-default-rtdb.firebaseio.com",
      projectId: "habitracer-1d4ed",
      storageBucket: "habitracer-1d4ed.firebasestorage.app",
      messagingSenderId: "97473637086",
      appId: "1:97473637086:web:b979c8356131d4b82f304f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const playersRef = ref(db, 'players');
    const gameStateRef = ref(db, 'gameState');

    let myPlayerId = null;
    let distance = 0;
    const FINISH_LINE = 1000;
    let gameEnded = false;

    document.getElementById('btn-host').addEventListener('click', setupHost);
    document.getElementById('btn-player').addEventListener('click', setupPlayerView);
    document.getElementById('btn-start-racing').addEventListener('click', joinGame);

    function setupHost() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('host-container').classList.remove('hidden');
      remove(playersRef); 
      set(gameStateRef, { ended: false });
      startHostCanvas();
      startTimer(300); // 300 seconds = 5 minutes
    }

    function setupPlayerView() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('player-join').classList.remove('hidden');
    }

    function joinGame() {
      const nameInput = document.getElementById('player-name').value.trim();
      if (!nameInput) return alert("Please enter your name!");

      const newPlayerRef = push(playersRef);
      myPlayerId = newPlayerRef.key;

      set(newPlayerRef, { name: nameInput, distance: 0 });
      onDisconnect(newPlayerRef).remove();

      document.getElementById('player-join').classList.add('hidden');
      document.getElementById('player-game-wrapper').classList.remove('hidden');

      onValue(gameStateRef, (snapshot) => {
        const state = snapshot.val();
        if (state && state.ended) {
          gameEnded = true;
        }
      });
      
      startArcadeGame();
    }

    // --- 5 MINUTE TIMER ENGINE ---
    function startTimer(durationSeconds) {
      let timer = durationSeconds;
      const timerDisplay = document.getElementById('timer-display');

      const interval = setInterval(() => {
        let minutes = Math.floor(timer / 60);
        let seconds = timer % 60;

        minutes = minutes < 10 ? "0" + minutes : minutes;
        seconds = seconds < 10 ? "0" + seconds : seconds;

        timerDisplay.innerText = `⏱️ Time Left: ${minutes}:${seconds}`;

        if (--timer < 0) {
          clearInterval(interval);
          timerDisplay.innerText = "⏱️ Time Left: 00:00 - GAME OVER!";
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameEnded = true;
      set(gameStateRef, { ended: true });

      onValue(playersRef, (snapshot) => {
        const playersData = snapshot.val() || {};
        showWinners(playersData);
      }, { onlyOnce: true });
    }

    function showWinners(playersData) {
      const winnerScreen = document.getElementById('winner-screen');
      const winnerList = document.getElementById('winner-list');
      winnerList.innerHTML = "";

      let sorted = Object.values(playersData).sort((a, b) => b.distance - a.distance);

      if (sorted.length > 0) {
        winnerList.innerHTML += `<div class="winner-box rank-1">🥇 1st Place: ${sorted[0].name} (${sorted[0].distance}m)</div>`;
      }
      if (sorted.length > 1) {
        winnerList.innerHTML += `<div class="winner-box rank-2">🥈 2nd Place: ${sorted[1].name} (${sorted[1].distance}m)</div>`;
      }
      if (sorted.length > 2) {
        winnerList.innerHTML += `<div class="winner-box rank-3">🥉 3rd Place: ${sorted[2].name} (${sorted[2].distance}m)</div>`;
      }

      winnerScreen.classList.remove('hidden');
    }

    // --- SPIDER-MAN PLAYER ARCADE ENGINE ---
    function startArcadeGame() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      let player = {
        x: 50,
        y: 150,
        w: 22,
        h: 30,
        vx: 0,
        vy: 0,
        speed: 3.5,
        jumpPower: -10,
        grounded: false,
        facingLeft: false
      };

      let keys = { left: false, right: false, up: false };
      let gravity = 0.5;

      let platforms = [
        { x: 0, y: 210, w: 400, h: 30 },
        { x: 80, y: 160, w: 90, h: 12 },
        { x: 220, y: 120, w: 100, h: 12 },
        { x: 130, y: 75, w: 80, h: 12 }
      ];

      let gems = [
        { x: 110, y: 130, w: 14, h: 14, label: "📚 Study", collected: false },
        { x: 260, y: 90, w: 14, h: 14, label: "🏋️ Gym", collected: false },
        { x: 160, y: 45, w: 14, h: 14, label: "💧 Water", collected: false }
      ];

      let hazards = [
        { x: 300, y: 190, w: 18, h: 20, label: "📱 Scroll", dir: -1 },
        { x: 100, y: 140, w: 18, h: 20, label: "🛌 Lazy", dir: 1 }
      ];

      const bindTouch = (btnId, keyName) => {
        const btn = document.getElementById(btnId);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        btn.addEventListener('mousedown', () => keys[keyName] = true);
        btn.addEventListener('mouseup', () => keys[keyName] = false);
      };

      bindTouch('btn-left', 'left');
      bindTouch('btn-right', 'right');
      bindTouch('btn-jump', 'up');

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      });

      // Helper function to render a custom Spider-Man Pixel Character
      function drawSpiderMan(p) {
        ctx.save();
        
        // Head (Red)
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(p.x + 3, p.y, 16, 12);
        
        // Spider-Man Mask Eyes (White triangular lenses)
        ctx.fillStyle = "#ffffff";
        if (!p.facingLeft) {
          ctx.beginPath();
          ctx.moveTo(p.x + 11, p.y + 4);
          ctx.lineTo(p.x + 17, p.y + 3);
          ctx.lineTo(p.x + 14, p.y + 8);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(p.x + 11, p.y + 4);
          ctx.lineTo(p.x + 5, p.y + 3);
          ctx.lineTo(p.x + 8, p.y + 8);
          ctx.fill();
        }

        // Torso - Red Center & Blue Sides
        ctx.fillStyle = "#1d4ed8"; // Blue suit sides
        ctx.fillRect(p.x + 2, p.y + 12, 18, 10);
        ctx.fillStyle = "#dc2626"; // Red suit center
        ctx.fillRect(p.x + 7, p.y + 12, 8, 10);

        // Black Spider Emblem on Chest
        ctx.fillStyle = "#000000";
        ctx.fillRect(p.x + 10, p.y + 15, 2, 4);
        ctx.fillRect(p.x + 8, p.y + 16, 6, 1);

        // Legs (Blue Pants + Red Boots)
        ctx.fillStyle = "#1d4ed8"; // Blue legs
        ctx.fillRect(p.x + 4, p.y + 22, 5, 5);
        ctx.fillRect(p.x + 13, p.y + 22, 5, 5);
        ctx.fillStyle = "#dc2626"; // Red boots
        ctx.fillRect(p.x + 4, p.y + 27, 5, 3);
        ctx.fillRect(p.x + 13, p.y + 27, 5, 3);

        ctx.restore();
      }

      function loop() {
        if (gameEnded) {
          ctx.fillStyle = "#ef4444";
          ctx.font = "bold 22px sans-serif";
          ctx.fillText("🛑 GAME OVER!", 120, 120);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (keys.left) {
          player.vx = -player.speed;
          player.facingLeft = true;
        } else if (keys.right) {
          player.vx = player.speed;
          player.facingLeft = false;
        } else {
          player.vx = 0;
        }

        if (keys.up && player.grounded) {
          player.vy = player.jumpPower;
          player.grounded = false;
        }

        player.vy += gravity;
        player.x += player.vx;
        player.y += player.vy;

        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

        player.grounded = false;
        platforms.forEach(plat => {
          if (
            player.x < plat.x + plat.w &&
            player.x + player.w > plat.x &&
            player.y + player.h >= plat.y &&
            player.y + player.h <= plat.y + plat.h + player.vy
          ) {
            player.grounded = true;
            player.vy = 0;
            player.y = plat.y - player.h;
          }

          ctx.fillStyle = "#334155";
          ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
          ctx.strokeStyle = "#475569";
          ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
        });

        // Collect Habit Gems (+60m Goal Distance)
        gems.forEach(gem => {
          if (!gem.collected) {
            ctx.fillStyle = "#22c55e";
            ctx.fillRect(gem.x, gem.y, gem.w, gem.h);
            ctx.fillStyle = "#fff";
            ctx.font = "10px sans-serif";
            ctx.fillText(gem.label, gem.x - 10, gem.y - 4);

            if (
              player.x < gem.x + gem.w &&
              player.x + player.w > gem.x &&
              player.y < gem.y + gem.h &&
              player.y + player.h > gem.y
            ) {
              gem.collected = true;
              distance = Math.min(FINISH_LINE, distance + 60);
              setTimeout(() => { gem.collected = false; }, 4000);
            }
          }
        });

        // Touch Red Hazard Enemies (-50m Penalty & Respawn)
        hazards.forEach(haz => {
          haz.x += haz.dir * 1.2;
          if (haz.x < 50 || haz.x > 320) haz.dir *= -1;

          ctx.fillStyle = "#ef4444";
          ctx.fillRect(haz.x, haz.y, haz.w, haz.h);
          ctx.fillStyle = "#fca5a5";
          ctx.font = "10px sans-serif";
          ctx.fillText(haz.label, haz.x - 10, haz.y - 4);

          if (
            player.x < haz.x + haz.w &&
            player.x + player.w > haz.x &&
            player.y < haz.y + haz.h &&
            player.y + player.h > haz.y
          ) {
            distance = Math.max(0, distance - 50);
            player.x = 20;
            player.y = 150;

            document.body.classList.add('hit-flash');
            setTimeout(() => document.body.classList.remove('hit-flash'), 200);
          }
        });

        // Render Spider-Man Character
        drawSpiderMan(player);

        if (player.vx !== 0) {
          distance = Math.min(FINISH_LINE, distance + 0.15);
        }

        document.getElementById('player-dist').innerText = Math.floor(distance);
        const myRef = ref(db, `players/${myPlayerId}`);
        update(myRef, { distance: Math.floor(distance) });

        requestAnimationFrame(loop);
      }

      loop();
    }

    // --- HOST ENGINE ---
    function startHostCanvas() {
      const canvas = document.getElementById('raceCanvas');
      const ctx = canvas.getContext('2d');
      let playersData = {};

      onValue(playersRef, (snapshot) => {
        playersData = snapshot.val() || {};
        updateLeaderboard(playersData);

        Object.values(playersData).forEach(p => {
          if (p.distance >= FINISH_LINE && !gameEnded) {
            endGame();
          }
        });
      });

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ef4444";
        ctx.fillRect(750, 0, 10, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("FINISH", 755, 20);

        let playersArray = Object.values(playersData);
        let laneHeight = canvas.height / Math.max(playersArray.length, 1);

        playersArray.forEach((player, index) => {
          let xProgress = (player.distance / FINISH_LINE) * 720;
          let yPos = index * laneHeight + laneHeight / 2;

          ctx.strokeStyle = "#334155";
          ctx.beginPath();
          ctx.moveTo(0, index * laneHeight);
          ctx.lineTo(canvas.width, index * laneHeight);
          ctx.stroke();

          // Draw Spider-Man Icon on host track
          ctx.fillStyle = "#ef4444";
          ctx.beginPath();
          ctx.arc(xProgress + 20, yPos, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#fff";
          ctx.font = "14px sans-serif";
          ctx.fillText(`🕷️ ${player.name}`, xProgress + 38, yPos + 4);
        });

        requestAnimationFrame(render);
      }

      render();
    }

    function updateLeaderboard(playersData) {
      const ranksContainer = document.getElementById('ranks');
      ranksContainer.innerHTML = "";

      let sorted = Object.values(playersData).sort((a, b) => b.distance - a.distance);

      sorted.forEach((player, idx) => {
        let div = document.createElement('div');
        div.className = 'player-rank';
        div.innerHTML = `<span>#${idx + 1} <b>🕷️ ${player.name}</b></span> <span>${player.distance} m</span>`;
        ranksContainer.appendChild(div);
      });
    }
  </script>
</body>
</html>
